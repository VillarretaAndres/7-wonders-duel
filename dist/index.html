<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>7 Wonders Duel — Edición de Mesa Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Marcellus&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Warm Mediterranean Sandstone, Parchment & Bronze Palette */
        --sand-bg: #2a1d12;
        --parchment-light: #f6ead4;
        --parchment-mid: #ead5b0;
        --parchment-dark: #d1b382;
        --ink-dark: #281a0e;
        --ink-muted: #5c4328;
        --bronze-dark: #4a3219;
        --bronze-border: #8c6635;
        --gold-accent: #d4a445;
        --gold-bright: #f2c968;
        --terracotta: #a63a22;
        --lapis: #1c5588;
        --emerald: #1c6b43;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--sand-bg);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: var(--ink-dark);
      }

      h1, h2, h3, h4, .font-serif {
        font-family: 'Cinzel', 'Marcellus', Georgia, serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }

      #phaser-container {
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .interactive {
        pointer-events: auto;
      }

      /* Tactile Parchment & Stone Panels */
      .parchment-panel {
        background: linear-gradient(160deg, #f8eedb 0%, #e7d1aa 100%);
        color: var(--ink-dark);
        border: 2px solid #8c622d;
        box-shadow:
          0 10px 28px rgba(15, 8, 2, 0.65),
          inset 0 0 0 1px rgba(255, 248, 231, 0.7),
          inset 0 0 18px rgba(139, 98, 45, 0.22);
      }

      .stone-bar {
        background: linear-gradient(180deg, rgba(46, 31, 18, 0.95) 0%, rgba(28, 18, 10, 0.97) 100%);
        color: #f4e6cc;
        border-color: #9e733b;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 224, 166, 0.25);
      }

      /* Authentic White Marble Nameplate Overlay (matches the blank marble scroll on card/wonder PNGs) */
      .marble-nameplate {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 800;
        color: #24170b;
        text-align: center;
        letter-spacing: 0.3px;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Classical Tabletop Buttons */
      .btn-imperial-gold {
        font-family: 'Cinzel', serif;
        font-weight: 800;
        background: linear-gradient(180deg, #f0c96b 0%, #c89532 55%, #a1711a 100%);
        color: #211304;
        border: 1.5px solid #593b0c;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 247, 214, 0.8);
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        text-shadow: 0 1px 0 rgba(255, 236, 179, 0.5);
      }
      .btn-imperial-gold:hover:not(:disabled) {
        filter: brightness(1.07);
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 247, 214, 0.9);
      }
      .btn-imperial-gold:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn-lapis {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        background: linear-gradient(180deg, #2b6ca3 0%, #18456e 100%);
        color: #f7eed8;
        border: 1.5px solid #8ab8e6;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease;
      }
      .btn-lapis:hover:not(:disabled) {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .btn-emerald {
        font-family: 'Cinzel', serif;
        font-weight: 800;
        background: linear-gradient(180deg, #2b8a53 0%, #185933 100%);
        color: #f8f3e6;
        border: 1.5px solid #7ed9a3;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease;
      }
      .btn-emerald:hover:not(:disabled) {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(66, 44, 21, 0.15);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(140, 102, 53, 0.65);
        border-radius: 3px;
      }

      @keyframes turnPulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(242, 201, 104, 0.55), 0 4px 12px rgba(0,0,0,0.45);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(242, 201, 104, 0), 0 4px 16px rgba(242, 201, 104, 0.65);
        }
      }

      .turn-active-badge {
        animation: turnPulse 2s infinite;
      }

      @keyframes modalBackdropFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes modalCardPop {
        0% { opacity: 0; transform: scale(0.92) translateY(12px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes draftCardReveal {
        0% { opacity: 0; transform: translateY(16px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes pawnBounce {
        0% { transform: rotate(90deg) scale(1.45); }
        60% { transform: rotate(90deg) scale(0.92); }
        100% { transform: rotate(90deg) scale(1); }
      }
      @keyframes pyramidDealDrop {
        0% { opacity: 0; transform: translate(-50%, -85%) scale(0.86); }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }
      @keyframes pyramidFlip3D {
        0% { transform: translate(-50%, -50%) scaleX(0.04) scaleY(1.06); }
        70% { transform: translate(-50%, -50%) scaleX(1.06) scaleY(1.02); }
        100% { transform: translate(-50%, -50%) scaleX(1) scaleY(1); }
      }

      .modal-backdrop-anim {
        animation: modalBackdropFade 0.18s ease-out forwards;
      }
      .modal-card-anim {
        animation: modalCardPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .draft-card-anim {
        animation: draftCardReveal 0.3s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      .pawn-anim {
        animation: pawnBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .pyramid-deal-anim {
        animation: pyramidDealDrop 0.28s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      .pyramid-flip-anim {
        animation: pyramidFlip3D 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .pyramid-card-node {
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .pyramid-card-node:hover {
        transform: translate(-50%, -53%) scale(1.05) !important;
      }

      .toast-msg {
        position: fixed;
        top: 66px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #9e2a1b, #6e1a0f);
        border: 1.5px solid #f0b27a;
        color: #fff6e5;
        padding: 10px 22px;
        border-radius: 8px;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 13px;
        z-index: 9999;
        box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
    </style>
    <script type="module" crossorigin src="/assets/index--jGtmgT6.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="phaser-container"></div>
      <div id="ui-layer"></div>
      <div id="chat-layer"></div>
    </div>
  </body>
</html>
